services:
  - type: web
    name: ticketing-app
    runtime: docker
    plan: starter
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: Novara Tickets
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Kampala
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: novaratechafrica@gmail.com
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_CHANNELS
        value: mobile_money
      - key: PAYSTACK_CURRENCY
        value: UGX
      - key: PAYSTACK_WEBHOOK_URL
        sync: false
      - key: MOMO_GATEWAY
        value: mtn
      - key: MOMO_MODE
        value: live
      - key: PUBLIC_STORAGE_ROOT
        value: /var/data/app/public
      - key: MOMO_WEBHOOK_PROVIDERS
        value: mtn
      - key: MTN_BASE_URL
        sync: false
      - key: MTN_PRIMARY_KEY
        sync: false
      - key: MTN_SECONDARY_KEY
        sync: false
      - key: MTN_TARGET_ENVIRONMENT
        sync: false
      - key: MTN_CALLBACK_URL
        sync: false
      - key: MTN_CURRENCY
        value: UGX
      - key: MTN_PAYEE
        value: Novara
      - key: MTN_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_COMMISSION_BPS
        value: "2000"
      - key: BRAND_NAME
        value: Novara Tickets
      - key: BRAND_COMPANY
        value: Novara Tech Africa
      - key: BRAND_EMAIL
        value: novaratechafrica@gmail.com
      - key: BRAND_WHATSAPP
        value: "+256765866555"
      - key: BRAND_WHATSAPP_LINK
        value: https://wa.me/256765866555
      - key: BRAND_INSTAGRAM
        value: "https://www.instagram.com/novara_tech_uganda?dlrf=azN4ZW9kdnBkOHFr"
      - key: BRAND_WEBSITE
        value: https://novara-tech-africa.kesug.com
      - key: APP_NOTIFICATION_MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: ticketing-data
      mountPath: /var/data
      sizeGB: 1
